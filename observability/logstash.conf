input {
  beats {
    port => 5044
  }
}

filter {
  # Our fields live under [app]. Use the service's own timestamp, not the time Filebeat read the line.
  date {
    match => ["[app][time]", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["agent", "ecs", "host", "input", "event", "log", "tags"]
  }
  # Gateway audit entries go to their own index for the compliance report.
  if [app][event] == "audit" {
    mutate { add_field => { "[@metadata][index]" => "researchdesk-audit" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "researchdesk-logs" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
