[project]
name = "researchdesk"
version = "0.1.0"
description = "Production-grade multi-agent research assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=1.3.0",
    "arxiv>=4.0.2",
    "beautifulsoup4>=4.15.0",
    "cryptography>=44.0",
    "fastapi>=0.162.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "openai>=1.60",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "redis>=5.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.7.0",
    "playwright>=1.64.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: calls the real OpenAI API and costs money"]
