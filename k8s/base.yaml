apiVersion: v1
kind: Namespace
metadata:
  name: researchdesk
---
# Everything that is not secret. Secrets come from the researchdesk-secrets Secret, created by clusterSetup.py from .env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: researchdesk-config
  namespace: researchdesk
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: researchdesk
  POSTGRES_DB: researchdesk
  GATEWAY_URL: http://gateway:8100/mcp
  SEARCH_URL: http://search:8101/mcp
  NOTES_URL: http://notes:8102/mcp
  FACTCHECKER_URL: http://factchecker:8110
  API_URL: http://api:8010
  CHEAP_MODEL: gpt-4o-mini
  STRONG_MODEL: gpt-4o
  OPENAI_REQUESTS_PER_MINUTE: "60"
  # The collector from the Compose observability profile, on the host. Traces land in the same Jaeger.
  OTLP_ENDPOINT: http://host.docker.internal:4318
  JAEGER_URL: http://localhost:16686
  KIBANA_URL: http://localhost:5601
  COOKIE_SECURE: "false"
  # The root filesystem is read-only: uv's cache and Python bytecode must not try to write to it.
  UV_CACHE_DIR: /tmp/uv-cache
  PYTHONDONTWRITEBYTECODE: "1"
