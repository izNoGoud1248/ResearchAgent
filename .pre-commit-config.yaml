# Checks that block real mistakes before they are committed; nothing here rewrites code.
#   uv run pre-commit install             once per clone
#   uv run pre-commit run --all-files     check everything by hand
# CI runs the same checks, so skipping the local hook does not skip them.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # API keys, tokens and private keys.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      # Room for the README demo GIF, not for videos or database dumps.
      - id: check-added-large-files
        args: [--maxkb=15000]
      # Kubernetes and Compose files hold several YAML documents.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        # tsconfig.json allows comments, which strict JSON does not.
        exclude: tsconfig\.json$

  - repo: local
    hooks:
      # .gitignore keeps .env out; this stops it even if someone force-adds it.
      - id: no-env-file
        name: never commit .env
        entry: .env holds secrets and must never be committed
        language: fail
        files: (^|/)\.env$
