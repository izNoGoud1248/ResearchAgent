# Included in every location: nginx drops server-level add_header lines in any location that adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://arxiv.org; connect-src 'self'; frame-ancestors 'none'" always;
