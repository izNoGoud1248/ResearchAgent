server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # /api/runs -> http://api:8010/runs. Same origin as the UI, so the session cookie flows and no CORS is needed.
    location /api/ {
        include /etc/nginx/snippets/securityHeaders.conf;
        proxy_pass http://api:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Live run events are Server-Sent Events: pass each one through as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        include /etc/nginx/snippets/securityHeaders.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/securityHeaders.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
